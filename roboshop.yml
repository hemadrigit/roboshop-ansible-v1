---
- name: create Ec2 instance and route 53
  hosts: localhost
  connection: local
  vars: 
    instances: ['mongodb', 'redis', 'mysql', 'rabbitmq']
    ami_id: ami-0055977a6e828a4f4
    action: create
    domain_name: gutha.shop
  tasks: 
    - name: create Ec2 instance
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        security_group: "{{ item}}-sg"
        region: us-east-1
      loop: "{{ instances }}"
      when: action == "create"
      register: ec2_output

    #- name: print ec2 ec2_output
    #  ansible.builtin.debug:
     #   msg: "{{ ec2_output }}"
    
    - name: create Route3 recored
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_id_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: action == "create"
        
        


