---
- name: configure mongodb server
  hosts: mongodb
  become: yes
  tasks:
     - name: copy mongodb repo
       ansible.builtin.copy:
         src: mongodb.repo
         dest: /etc/yum.repos.d/mongo.repo

     - name: Install mongodb
       ansible.builtin.package:
         name: mongodb-org
         state: present
       register: install  

     - name: Display mongod istall status
       ansible.builtin.debug:
         msg: "{{ install }}"  
         
     - name: mongodb start service
       ansible.builtin.service:
         name: mongodb
         state: started
         enabled: yes
           