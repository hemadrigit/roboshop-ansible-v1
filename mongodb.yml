---
- name: configure mongodb server
  hosts: mongodb
  become: yes
  tasks:
     - name: copy mongodb repo
       ansible.builtin.copy:
         src: mongodb.repo
         dest: /etc/yum.repos.d/mongo.repo

     - name: Install mongodb
       ansible.builtin.package:
         name: mongodb-org
         state: present
     
     - name: mongodb start service
       ansible.builtin.service:
         name: mongodb.org
         state: started
         enabled: yes
           