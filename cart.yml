---
- name: configure cart server
  hosts: cart
  become: yes
  tasks:
    - name: Disable nodejs
      command: dnf module disable nodejs -y

    - name: Enable nodejs:24
      command: dnf module enable nodejs:24 -y

    - name: Install nodejs
      ansible.builtin.package:
          name: nodejs
          state: present

    - name: create roboshop system cart 
      ansible.builtin.user:
        name: roboshop
        system: true          # Creates a system account (UID < 1000)
        shell: /sbin/nologin # Disables interactive login
        home: /app           # Sets custom home directory
        create_home: false     
        state: present
        comment: "roboshop system cart"

    - name: Remove existing app directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: remove existing catalog zip file if any
      ansible.builtin.file:
        path: /tmp/cart.zip
        state: absent

    - name: Create app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download the catalog application 
      ansible.builtin.get_url:
        url:  https://raw.githubcartcontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-{{ app_version }}.zip
        dest: /tmp/cart.zip

    - name: Unzip catalog
      ansible.builtin.unarchive:
        src: /tmp/cart.zip
        dest: /app
        remote_src: yes
       
    - name: Install npm dependencies
      community.general.npm:
        path: /app

    - name: copy & configure systemD service
      ansible.builtin.template:
        src: cart.service.j2
        dest: /etc/systemd/system/cart.service

    - name: Deamon reload
      ansible.builtin.systemd_service:
         daemon_reload: true

    - name: start and enable cart
      ansible.builtin.service:
        name: cart
        state: restarted
        enabled: true