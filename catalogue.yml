---
- name: configure catalogue server
  hosts: catalogue
  become: yes
  tasks:
    - name: Disable nodejs
      command: dnf module disable nodejs -y

    - name: Enable nodejs:24
      command: dnf module enable nodejs:24 -y

    - name: Install nodejs
      ansible.builtin.package:
          name: nodejs
          state: present

    - name: create roboshop system user 
      ansible.builtin.user:
        name: roboshop
        system: true          # Creates a system account (UID < 1000)
        shell: /sbin/nologin # Disables interactive login
        home: /app           # Sets custom home directory
        create_home: false     
        state: present
        comment: "roboshop system user"

    - name: Remove existing app directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: remove existing catalog zip file if any
      ansible.builtin.file:
        path: /tmp/catalogue.zip
        state: absent

    - name: Create app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download the catalog application 
      ansible.builtin.get_url:
        url:  https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
        dest: /tmp/catalogue.zip

    - name: Unzip catalog
      ansible.builtin.unarchive:
        src: /tmp/catalogue.zip
        dest: /app
        remote_src: yes
       
    - name: Install npm dependencies
      community.general.npm:
        path: /app

    - name: copy & configure systemD service
      ansible.builtin.template:
        src: catalogue.service.j2
        dest: /etc/systemd/system/catalogue.service

    - name: copy monogoDB repo
      ansible.builtin.copy:
        src: mongodb.repo
        dest: /etc/yum.repos.d/mongo.repo

    - name: Install mongoDB client
      ansible.builtin.dnf:
        name: mongodb-mongosh
        state: present

    - name: check products loaded or not
      command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
      register: product_count

    - name: check produt community.general.npm
      ansible.builtin.debug:
         msg: " product counts are {{ product_count }}"