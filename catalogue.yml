---
- name: configure catalogue server
  hosts: catalogue
  become: yes
  tasks:
    - name: Disable nodejs
      command: dnf module disable nodejs -y

    - name: Enable nodejs:24
      command: dnf module enable nodejs:24 -y

    - name: Install nodejs
      ansible.builtin.package:
        - name: nodejs
          state: present

    - name: create roboshop system user 
      ansible.builtin.user:
        name: roboshop
        system: true          # Creates a system account (UID < 1000)
        shell: /sbin/nologin # Disables interactive login
        home: /app           # Sets custom home directory
        create_home: false     
        state: present
        comment: "roboshop system user"
