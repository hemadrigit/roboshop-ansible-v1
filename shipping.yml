---
- name: configure shipping server
  hosts: shipping
  become: yes
  tasks:
    - name: configure enable maven:3.9
      command: dnf module enable maven:3.9 -y

    - name: install maven
      dnf: 
        name:
          - maven
          - java-25-openjdk-devel
          - maven-openjdk25
        state: present

    - name: create roboshop system user 
      ansible.builtin.user:
        name: roboshop
        system: true          # Creates a system account (UID < 1000)
        shell: /sbin/nologin # Disables interactive login
        home: /app           # Sets custom home directory
        create_home: false     
        state: present
        comment: "roboshop system user"

    - name: Remove existing app directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: remove existing catalog zip file if any
      ansible.builtin.file:
        path: /tmp/shipping.zip
        state: absent

    - name: Create app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download the catalog application 
      ansible.builtin.get_url:
        url:  https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
        dest: /tmp/shipping.zip

    - name: Unzip catalog
      ansible.builtin.unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: yes

    - name: Install dependencies
      command: mvn clean package
      args:
        chdir: /app
      