---
- name: configure shipping server
  hosts: shipping
  become: yes
  tasks:
    - name: configure enable maven:3.9
      command: dnf module enable maven:3.9 -y

    - name: install maven
      dnf: 
        name:
          - maven
          - java-25-openjdk-devel
          - maven-openjdk25
        state: present

    - name: create roboshop system user 
      ansible.builtin.user:
        name: roboshop
        system: true          # Creates a system account (UID < 1000)
        shell: /sbin/nologin # Disables interactive login
        home: /app           # Sets custom home directory
        create_home: false     
        state: present
        comment: "roboshop system user"

    - name: Remove existing app directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: remove existing catalog zip file if any
      ansible.builtin.file:
        path: /tmp/shipping.zip
        state: absent

    - name: Create app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download the catalog application 
      ansible.builtin.get_url:
        url:  https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
        dest: /tmp/shipping.zip

    - name: Unzip catalog
      ansible.builtin.unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: yes

    - name: Build shipping
      command: mvn clean package
      args:
        chdir: /app
      
    - name: move shipping.jar
      command:  mv target/shipping.jar shipping.jar
      args:
        chdir: /app

    - name: check cities data exist or not
      command: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} -N -B -e "SELECT COUNT(*) FROM cities.cities;"
      register: cities_count
      ignore_errors: true

    - name: print cities COUNT(*)
      debug:
        msg: "{{ cities_count }}"

    - name: load cities data into mysql
      command: mysql -h "{{ mysql_host }}" -u root -p {{ mysql_root_password }} < /app/db/master-data.sql
      when: cities_count.rc != 0 or cities_count.stdout | int == 0

    - name: create app user in mysql
      command: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} < /app/db/master-data.sql
      
    - name: copy & configure systemD service
      ansible.builtin.template:
        src: shipping.service.j2
        dest: /etc/systemd/system/shipping.service

    - name: Deamon reload
      ansible.builtin.systemd_service:
         daemon_reload: true

    - name: start and enable shipping
      ansible.builtin.service:
        name: shipping
        state: restarted
        enabled: true

