[defaults]
# Path to your inventory file or directory
inventory = ./inventory.ini

# Default remote user to connect as on managed nodes
#remote_user = ansible

# Location of your SSH private key for authentication
#private_key_file = ~/.ssh/id_rsa

# Colon-separated paths where Ansible searches for Roles
#roles_path = ./roles:~/.ansible/roles

# Maximum number of parallel processes to use
#forks = 10
